# Setup
title:               "differential-geometry Self-Learning"
description:         'Comprehensive differential-geometry Course'
url:                 https://nglelinh.github.io
baseurl:             '/differential-geometry-self-learning'
imgurl:              https://nglelinh.github.io/differential-geometry-self-learning/img
paginate:            5
permalink:           pretty

# Multi-language support
languages:           ["en", "vi"]
default_lang:        "en"
exclude_from_localization: ["javascript", "images", "css", "public"]
parallel_localization: true

# Language-specific configurations
t:
  en:
    title: "differential-geometry Self-Learning"
    description: "Comprehensive differential-geometry Course for Math Students"
    home: "Home"
    chapters: "Chapters"
    language: "Language"
    switch_language: "Switch to Vietnamese"
    required: "Required"
    optional: "Optional"
  vi:
    title: "Tự học Hình học vi phân"
    description: "Khóa học differential-geometry toàn diện cho sinh viên toán"
    home: "Trang chủ"
    chapters: "Các chương"
    language: "Ngôn ngữ"
    switch_language: "Chuyển sang tiếng Anh"
    required: "Bắt buộc"
    optional: "Tùy chọn"
# About/contact
author:
  name:              Nguyen Le Linh
  email:             nglelinh@gmail.com

# Gems
plugins:
  - jekyll-paginate
  - jekyll-feed

plugins_dir: _plugins

# Collections for multilingual content
collections:
  posts:
    output: true
    permalink: /:categories/:title/

# Custom vars
version:             0.0.1
markdown: kramdown

# differentials
google_differentials_id: ""
