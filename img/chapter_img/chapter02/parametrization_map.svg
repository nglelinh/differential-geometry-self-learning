<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <!-- UV Plane -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="150" height="150" fill="#e0e0e0" stroke="black" stroke-width="2"/>
    <text x="75" y="170" text-anchor="middle" font-family="Arial" font-size="14">Mặt phẳng (u, v)</text>
    <line x1="10" y1="140" x2="50" y2="140" stroke="blue" stroke-width="2"/>
    <line x1="10" y1="140" x2="10" y2="100" stroke="red" stroke-width="2"/>
    <text x="55" y="145" fill="blue">u</text>
    <text x="10" y="95" fill="red">v</text>
    
    <!-- Grid in UV -->
    <line x1="50" y1="0" x2="50" y2="150" stroke="gray" stroke-dasharray="4"/>
    <line x1="100" y1="0" x2="100" y2="150" stroke="gray" stroke-dasharray="4"/>
    <line x1="0" y1="50" x2="150" y2="50" stroke="gray" stroke-dasharray="4"/>
    <line x1="0" y1="100" x2="150" y2="100" stroke="gray" stroke-dasharray="4"/>
  </g>
  
  <!-- Arrow -->
  <g transform="translate(220, 120)">
    <path d="M 0 0 L 80 0" stroke="black" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="40" y="-10" text-anchor="middle" font-family="Arial" font-size="16" font-style="italic">r(u, v)</text>
  </g>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black" />
    </marker>
  </defs>
  
  <!-- Surface in XYZ -->
  <g transform="translate(350, 50)">
    <path d="M 20 130 Q 75 180 130 130 Q 180 80 130 30 Q 75 -20 20 30 Q -30 80 20 130" fill="#d0f0ff" stroke="black" stroke-width="2"/>
    <text x="75" y="170" text-anchor="middle" font-family="Arial" font-size="14">Bề mặt S trong R³</text>
    
    <!-- Curved Grid -->
    <path d="M 45 105 Q 75 130 105 105" fill="none" stroke="blue" stroke-width="2"/>
    <path d="M 45 105 Q 20 80 45 55" fill="none" stroke="red" stroke-width="2"/>
    
    <path d="M 75 130 Q 100 80 75 30" fill="none" stroke="gray" stroke-dasharray="4"/>
    <path d="M 20 80 Q 75 80 130 80" fill="none" stroke="gray" stroke-dasharray="4"/>
  </g>
</svg>