<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="sphereGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:rgb(255,200,100);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(200,100,0);stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Sphere -->
  <circle cx="200" cy="150" r="100" fill="url(#sphereGrad)" stroke="none"/>
  
  <!-- Grid lines (approximate for visual) -->
  <path d="M 100 150 Q 200 250 300 150" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
  <path d="M 100 150 Q 200 50 300 150" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
  <path d="M 200 50 Q 150 150 200 250" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
  <path d="M 200 50 Q 250 150 200 250" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
  
  <!-- Ant (simplified) -->
  <g transform="translate(200, 120) scale(0.5)">
    <ellipse cx="0" cy="0" rx="10" ry="5" fill="black"/>
    <ellipse cx="12" cy="0" rx="7" ry="4" fill="black"/>
    <circle cx="-10" cy="-2" r="5" fill="black"/>
    <!-- Legs -->
    <line x1="0" y1="0" x2="-5" y2="10" stroke="black" stroke-width="2"/>
    <line x1="0" y1="0" x2="5" y2="10" stroke="black" stroke-width="2"/>
    <line x1="10" y1="0" x2="15" y2="10" stroke="black" stroke-width="2"/>
    <line x1="10" y1="0" x2="5" y2="10" stroke="black" stroke-width="2"/>
  </g>
  
  <!-- Thought bubble -->
  <path d="M 210 110 L 230 90 L 240 95 L 230 90 Q 260 60 290 90 Q 300 110 270 110 Q 240 120 210 110" fill="white" stroke="black" stroke-width="1"/>
  <text x="245" y="100" font-family="Arial" font-size="12" fill="black">Phẳng?</text>
</svg>